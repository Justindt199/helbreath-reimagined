// The sign-in screen's layout. The game reads it when it starts; a missing line keeps its usual value.
// Change it from the dashboard's "Login screen" tab (tools/hb_dashboard) or by hand.
//
// anchor   the point of the screen a piece is measured from, and the same point of the piece itself:
//          top-left, top, top-right, left, center, right, bottom-left, bottom, bottom-right
// x, y     how far from that point, in game pixels (the screen is 480 high; right and down are +)
// show     yes or no
// Three screens: sign in ([logo] to [quit]), character select ([characters title] to [change password];
// [version] shows there too) and create account ([new account panel] to [back to sign in]).
// The pieces after [panel] sit inside the sign-in panel, and the pieces after [new account panel]
// inside that panel: their x and y are from its top left corner.

[logo]
anchor = top
x = 0
y = 9
show = yes
text = H E L B R E A T H
text 2 = Reimagined

[news]
anchor = top
x = 0
y = 92
show = yes
text = NEWS
line 1 = We write our news here!
line 2 =
line 3 =
line 4 =

