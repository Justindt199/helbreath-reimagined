<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helbreath Reimagined Server Data</title>
<style>
@font-face { font-family: "VDecoBold"; src: url("fonts/CinzelDecorative-Bold.ttf") format("truetype"); font-display: swap; }
:root {
  --bg: #121013; --panel: #1b181c; --raise: #252027; --line: #3a3238; --ink: #ece4d6; --muted: #a39788;
  --gold: #d9a441; --edit: #5fb6e8; --good: #77c47a; --warn: #e0a24a; --bad: #e06a55;
  --display: "VDecoBold", "Cinzel", Georgia, serif; --body: "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--edit); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
header { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; padding: 14px 20px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font: 700 21px/1.1 var(--display); letter-spacing: .05em; color: var(--gold); margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); background: var(--bg); }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip.live::before, .chip.off::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.chip.off::before { background: var(--warn); }
.chip.pend { border-color: var(--edit); color: var(--edit); cursor: pointer; background: none; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 20px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 11px; cursor: pointer; color: var(--muted); font-weight: 600; }
.tab[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
.tab small { font-weight: 400; margin-left: 4px; font-variant-numeric: tabular-nums; }
.tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--edit); margin-left: 5px; vertical-align: middle; }
input[type=search], .fin, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
input[type=search] { width: 240px; max-width: 100%; margin-left: auto; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
.tablewrap { overflow: auto; min-height: 0; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-weight: 600; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; }
th.num, td.num { text-align: right; }
th[aria-sort] { color: var(--gold); }
td { padding: 6px 10px; border-bottom: 1px solid #262126; white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--raise); }
tbody tr[aria-selected="true"] td { background: #1d2a33; }
td.ed { color: var(--edit); }
.nm { font-weight: 600; }
.mini { color: var(--muted); font-size: 12px; }
.tag { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--edit); color: var(--edit); margin-left: 6px; vertical-align: 1px; }
.tag.ok { border-color: var(--good); color: var(--good); }
.more { padding: 12px; text-align: center; color: var(--muted); }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; min-height: 0; }
.empty { padding: 30px 22px; color: var(--muted); }
.edh { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.edh h2 { font: 700 17px/1.2 var(--display); color: var(--gold); margin: 0; letter-spacing: .03em; word-break: break-word; }
.edh .mini { margin-top: 4px; }
.fgrid { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 6px 10px; align-items: center; padding: 14px 18px; }
.fgrid label { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fgrid .fin { width: 100%; padding: 4px 8px; font-variant-numeric: tabular-nums; }
.fgrid .fin.chg { border-color: var(--edit); color: var(--edit); }
.fgrid .fin[readonly] { color: var(--muted); border-style: dashed; }
.fgrid .hint { grid-column: 2; margin-top: -4px; font-size: 11.5px; color: var(--muted); }
.fgrid .was { grid-column: 2; margin-top: -4px; font-size: 11.5px; color: var(--edit); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 4px 18px 18px; }
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 6px 13px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--gold); color: #1b1408; border-color: var(--gold); font-weight: 700; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.msg { padding: 0 18px 14px; font-size: 13px; }
.msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
.note { margin: 0 18px 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 12.5px; }
.changes { padding: 16px 20px; display: grid; gap: 10px; align-content: start; }
.change { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--panel); }
.change h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.change h3 .btn { margin-left: auto; }
.change .row { display: grid; grid-template-columns: 160px 1fr; gap: 2px 10px; font-size: 13px; }
.change .from { color: var(--muted); text-decoration: line-through; margin-right: 8px; }
.change .to { color: var(--edit); }
h4 { font: 700 13px var(--display); color: var(--gold); letter-spacing: .05em; margin: 8px 0 0; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } aside { border-left: 0; border-top: 1px solid var(--line); max-height: 55vh; } }

  /* Login screen tab: the sign-in screen as movable pieces */
  .stagewrap { padding: 14px 16px 24px; }
  .stagebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; color: var(--muted); font-size: 13px; }
  .stagebar select { background: var(--raise); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .stagefit { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #000; }
  .stage { position: relative; transform-origin: 0 0; overflow: hidden; user-select: none; -webkit-user-select: none; font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(ellipse at 30% 60%, #2f4a22 0%, #1d3017 45%, #10190f 100%); }
  .stage::before { content: "the live town plays here"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,.13); font-size: 13px; letter-spacing: .08em; }
  .lm { position: absolute; cursor: grab; touch-action: none; outline: 1px dashed rgba(255,255,255,.22); outline-offset: 2px; white-space: nowrap; }
  .lm:hover { outline-color: var(--gold); }
  .lm[aria-selected="true"] { outline: 2px solid var(--edit); }
  .lm.moved::after { content: ""; position: absolute; right: -5px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--edit); }
  .lm.hid { opacity: .28; }
  .lm.drag { cursor: grabbing; }
  .lm-logo .s { font-size: 14px; color: #d9c48f; text-shadow: 1px 1px 0 #000; }
  .lm-logo .b { font-family: var(--display); font-size: 42px; line-height: 44px; color: #f2cf73; text-shadow: 2px 2px 0 #000; letter-spacing: 1px; }
  .lm-news { background: rgba(10,12,16,.63); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 6px 12px 8px; }
  .lm-news .h { font-size: 11px; color: #f2cf73; line-height: 16px; } .lm-news .l1 { font-size: 15px; color: #f0f2f5; line-height: 18px; font-weight: 700; } .lm-news .l { font-size: 12px; color: #9aa2ac; line-height: 16px; }
  .lm-town { font-family: var(--display); font-size: 14px; line-height: 14px; color: #e0906a; text-shadow: 1px 1px 0 #000; }
  .lm-version { font-size: 11px; line-height: 11px; color: #6f7782; }
  .lm-panel { background: linear-gradient(#34302c, #24211f); border: 2px solid #6b6154; border-radius: 4px; box-shadow: inset 0 0 0 1px #17130f, 0 6px 22px rgba(0,0,0,.5); }
  .lm-characterstitle { font-family: var(--display); font-size: 15px; color: #f2cf73; text-shadow: 1px 1px 0 #000; }
  .lm-hint { font-size: 12px; color: #bac0c8; }
  .lm-changepassword { font-size: 11px; color: #6f7782; }
  .lm-characterinfo { background: rgba(10,12,16,.75); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; }
  .lm-characterinfo .t { position: absolute; left: 12px; top: 10px; font-family: var(--display); font-size: 15px; color: #f2cf73; }
  .lm-characterinfo .st { position: absolute; left: 12px; top: 36px; font-size: 12px; color: #9aa2ac; white-space: normal; right: 12px; }
  .lm-accounthelp { font-size: 11px; color: #9aa2ac; line-height: 13px; white-space: normal; }
  .lm-panel > .t { position: absolute; left: 18px; top: 14px; font-family: var(--display); font-size: 15px; color: #f2cf73; pointer-events: none; }
  .lm-panel > .st { position: absolute; left: 18px; top: 38px; font-size: 12px; color: #9aa2ac; pointer-events: none; }
  .lm-box { background: rgba(0,0,0,.47); border: 1px solid rgba(255,255,255,.16); border-radius: 6px; }
  .lm-box .lb, .lm-remember { font-size: 11px; color: #9aa2ac; }
  .lm-box .lb { position: absolute; left: 0; top: -18px; }
  .lm-remember { font-size: 12px; color: #b9c0c9; display: flex; align-items: center; gap: 7px; }
  .lm-remember i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.35); display: inline-block; }
  .lm-btn { background: linear-gradient(#4a443d, #322e2a); border: 1px solid #7a6c58; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #dce0e6; }
  .lm-connect { font-size: 15px; font-weight: 700; color: #96907f; }
  select.fin { appearance: auto; }
  textarea.fin { resize: vertical; min-height: 64px; font: inherit; line-height: 1.4; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Helbreath Reimagined · Server Data</h1>
      <div class="sub">Every item, monster, drop, spell, recipe, quest and teleport on the server, the VALORIA achievements, side quests, shrines and chests, and the sign-in screen's layout. Change a value and save: it goes into the game with the next update.</div>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <input type="search" id="q" placeholder="Search this tab…" aria-label="Search">
  </div>
  <main>
    <div class="tablewrap" id="tablewrap"></div>
    <aside id="editor"></aside>
  </main>
</div>
<script type="application/json" id="gamedata">__DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("gamedata").textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ITEMNAME = DATA.itemNames;

  // what each tab shows in its table; every field shows in the editor
  const TABS = [
    { k: "items", label: "Items", cols: ["id", "name", "item type", "equip slot", "level needed", "effect", "value 1", "value 2", "price", "weight", "durability"], title: "name" },
    { k: "monsters", label: "Monsters", cols: ["name", "hit dice", "defense", "hit ratio", "exp dice", "attack dice", "attack range dice", "magic level", "magic resist", "regen time"], title: "name" },
    { k: "drops", label: "Drops", cols: ["monster", "tier", "tier chance", "item", "weight", "share of tier"], title: r => r.f.item + " from " + r.f.monster },
    { k: "spells", label: "Spells", cols: ["id", "name", "mana cost", "int needed", "gold cost", "delay", "duration", "value 1", "value 2", "value 3"], title: "name" },
    { k: "alchemy", label: "Alchemy", cols: ["id", "name", "@ingredients", "skill", "difficulty"], title: "name" },
    { k: "crafting", label: "Crafting", cols: ["id", "name", "@ingredients", "skill", "difficulty"], title: "name" },
    { k: "forging", label: "Forging", cols: ["name", "skill", "@materials", "max skill", "chance"], title: "name" },
    { k: "quests", label: "Quests", cols: null, title: r => "Quest " + r.id },
    { k: "teleports", label: "Teleports", cols: ["npc", "name", "map", "x", "y", "cost", "min level", "max level", "side"], title: r => r.f.npc + " → " + r.f.map },
    { k: "achievements", label: "Achievements", cols: ["category", "group", "tier", "count", "title"], title: r => r.f.name },
    { k: "sidequests", label: "Side quests", cols: ["title", "giver", "min level", "reward item", "reward count"], title: r => r.f.title },
    { k: "shrines", label: "Shrines & chests", cols: ["kind", "map", "x", "y", "chest tier"], title: r => r.f.kind + " · " + r.f.map },
    { k: "chests", label: "Chest loot", cols: ["gold", "potion", "material", "gear chance"], title: r => "Chest, " + r.id },
    { k: "login", label: "Login screen", cols: ["x", "y"], title: r => LM_LABEL[r.id] || r.id },
  ];
  // the sign-in screen's pieces (Client/CONTENTS/login_layout.cfg): the first five sit on the screen, the rest inside the panel
  const LM_LABEL = { logo: "Logo", news: "News box", town: "Town name", version: "Version text", panel: "Sign-in panel", account: "Account box",
    password: "Password box", remember: "Remember account", connect: "Connect button", create: "Create account button", quit: "Quit button",
    "characters title": "Title", "character info": "Character details", hint: "Hint line", back: "Back button", delete: "Delete / Create button",
    play: "Play button", "log out": "Log out button", "change password": "Change password link",
    "new account panel": "Create-account panel", "new account": "Account box", "new password": "Password box", "confirm password": "Confirm password box",
    "e-mail": "E-mail box", "secret question": "Secret question box", answer: "Answer box", "account help": "Help text",
    "create account": "Create account button", clear: "Clear button", "back to sign in": "Back to sign in button" };
  // the three screens: their pieces on the screen, and the panel whose pieces sit inside it
  const SCREENS = [
    { k: "signin", label: "Sign in", top: ["logo", "news", "town", "version", "panel"], panel: "panel",
      inside: ["account", "password", "remember", "connect", "create", "quit"] },
    { k: "select", label: "Character select", top: ["characters title", "character info", "hint", "back", "delete", "play", "log out", "change password", "version"] },
    { k: "create", label: "Create account", top: ["new account panel"], panel: "new account panel",
      inside: ["new account", "new password", "confirm password", "e-mail", "secret question", "answer", "account help", "create account", "clear", "back to sign in"] } ];
  const LM_INSIDE = SCREENS.flatMap(sc => sc.inside || []);
  const LM_BTN = new Set(["connect", "create", "quit", "back", "delete", "play", "log out", "create account", "clear", "back to sign in"]);
  const LM_BOX = new Set(["account", "password", "new account", "new password", "confirm password", "e-mail", "secret question", "answer"]);
  let screen = 0;
  const ANCHORS = ["top-left", "top", "top-right", "left", "center", "right", "bottom-left", "bottom", "bottom-right"];
  const STAGES = [[854, 480, "16:9 screen"], [640, 480, "4:3 screen"], [1120, 480, "21:9 screen"]];
  let stage = 0;
  // fields that name a row: changing them would break what points at it
  const LOCKED = { items: ["id", "name"], monsters: ["name"], spells: ["id"], quests: ["n"], alchemy: ["id"], crafting: ["id"], forging: ["name"],
    drops: ["monster", "tier", "item", "share of tier"], teleports: [], login: [], achievements: ["category", "group", "tier"], sidequests: [], shrines: [], chests: [] };
  // VALORIA content: words with spaces, compiled into the game (tools/valoria_port/data, build_content.py)
  const CONTENT = new Set(["achievements", "sidequests", "shrines", "chests"]);
  const LONG = new Set(["offer", "hand-in"]);
  function optsFor(kind, k) {
    if (kind === "login" && k === "anchor") return ANCHORS;
    if (kind === "login" && k === "show") return ["yes", "no"];
    if (kind === "sidequests" && k === "giver") return ["McGaffin", "Perry", "Devlin"];
    if (kind === "sidequests" && / type$/.test(k)) return ["none", "kill", "collect", "visit"];
    if (kind === "shrines" && k === "kind") return ["shrine of might", "shrine of swiftness", "shrine of wisdom", "shrine of fortune", "shrine of vigor", "chest"];
    return null;
  }
  const HINTS = {
    "item type": { 0: "none", 1: "equip", 2: "apply", 3: "use (used up)", 4: "install", 5: "consume", 6: "arrow", 7: "eat", 8: "use skill", 9: "use (kept)", 10: "opens a window", 11: "use on an item", 12: "material" },
    "equip slot": { 0: "none", 1: "head", 2: "body", 3: "arms", 4: "legs", 5: "feet", 6: "neck", 7: "left hand", 8: "right hand", 9: "both hands", 10: "ring", 11: "ring", 12: "back", 13: "full body" },
    "gender": { 0: "any", 1: "male", 2: "female" },
  };
  const NOTES = {
    drops: "Weight is the item's share of its tier: an item with weight 10 in a tier whose weights add up to 1000 drops 1% of the times that tier is picked. Tier chance is out of 1000.",
    alchemy: "VALORIA recipes. Ingredients are item numbers: the name is shown under each one.",
    crafting: "VALORIA recipes. Ingredients are item numbers: the name is shown under each one.",
    forging: "VALORIA recipes. Materials are item numbers: the name is shown under each one.",
    items: "Values 1–6 mean different things for each effect (damage dice for weapons, defense for armour, the amount for potions…).",
    achievements: "Each achievement is a counter reaching its count; its title is what a player can wear in front of their name. Group and tier can't change: saved progress counts by them. Changes here are compiled into the game, so they arrive with the next rebuild.",
    sidequests: "Quests unlock in order for each giver. Objectives: kill a monster (its Npc.cfg name), collect what a kill of the listed monsters drops at 'chance' percent, or visit a map; several monsters or maps are separated with |. Set an objective's type to none to remove it. The reward item is its item-list name. Changes arrive with the next rebuild.",
    shrines: "A shrine blesses whoever walks up to it, then recharges for 5 minutes; a chest spills its tier's loot (see Chest loot) and refills after 15 minutes. x and y are map tiles: stand there in game to read them off the bottom bar. Changes arrive with the next rebuild.",
    chests: "Gold is this amount times 1 to 3. Potion (1 to 3 of them) and material are item-list names. Gear chance is the percent chance of one piece of wearable VALORIA gear of the chest's tier (no gear needs a tier-5 level, so tier-5 chests give tier-4 gear). Changes arrive with the next rebuild.",
    login: "Drag a piece to move it, or pick it and nudge it with the arrow keys (Shift = 10 at a time). Anchor is the point of the screen a piece keeps its distance from, so it stays put on wider and narrower screens; the pieces inside the panel move with the panel. The sign-in screen is always 480 high.",
  };

  const ROWS = {}; const BYKEY = new Map();
  for (const t of TABS) {
    ROWS[t.k] = (DATA.rows[t.k] || []).map(([id, f]) => ({ kind: t.k, id, f }));
    for (const r of ROWS[t.k]) BYKEY.set(t.k + "|" + r.id, r);
    if (!t.cols) t.cols = Object.keys((ROWS[t.k][0] || { f: {} }).f).slice(0, 10);
  }
  const fieldsOf = kind => Object.keys((ROWS[kind][0] || { f: {} }).f);

  // ---- state
  let tab = "items", sel = null, q = "", sortKey = null, sortDir = 1, limit = 300;
  let db = null, canWrite = false, edits = {}, loaded = false, msg = "", msgKind = "";
  const docId = (kind, id) => kind + "~" + String(id).replace(/[^A-Za-z0-9_.()-]/g, c => "_" + c.charCodeAt(0).toString(16));
  const editOf = r => edits[docId(r.kind, r.id)];
  const pendingEdit = r => { const e = editOf(r); return e && e.status === "pending" ? e : null; };
  const eff = r => { const e = pendingEdit(r); return e ? { ...r.f, ...e.fields } : r.f; };
  const tdef = k => TABS.find(t => t.k === k);
  const titleOf = r => { const t = tdef(r.kind).title; return typeof t === "function" ? t(r) : r.f[t]; };
  const pending = () => Object.values(edits).filter(e => e.status === "pending");

  function ingr(f, word) {
    const out = [];
    for (let i = 1; i <= 6; i++) {
      const id = f[`${word} ${i}`], n = f[`amount ${i}`];
      if (id && id !== "-1" && id !== "0") out.push(`${n}× ${ITEMNAME[id] || "#" + id}`);
    }
    return out.join(", ");
  }
  function cell(r, c) {
    const v = eff(r);
    if (c === "@ingredients") return ingr(v, "ingredient");
    if (c === "@materials") return ingr(v, "material");
    return v[c];
  }

  // ---- header + tabs
  function renderChips() {
    const p = pending().length;
    $("#chips").innerHTML =
      `<span class="chip ${db ? "live" : "off"}">${db ? (canWrite ? "Saving on" : "Read only") : (loaded ? "Not connected" : "Connecting…")}</span>` +
      `<span class="chip"><b>${ROWS.items.length}</b> items</span><span class="chip"><b>${ROWS.monsters.length}</b> monsters</span>` +
      (p ? `<button class="chip pend" id="pendchip"><b>${p}</b> change${p === 1 ? "" : "s"} waiting for the next update</button>` : "") +
      `<span class="chip">Data from ${esc(DATA.built)}</span>`;
    const pc = $("#pendchip"); if (pc) pc.onclick = () => go("changes");
  }
  function renderTabs() {
    const pk = new Set(pending().map(e => e.kind));
    $("#tabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" data-k="${t.k}" aria-selected="${tab === t.k}">${t.label}<small>${ROWS[t.k].length}</small>${pk.has(t.k) ? '<span class="dot" title="Has saved changes"></span>' : ""}</button>`).join("")
      + `<button class="tab" role="tab" data-k="changes" aria-selected="${tab === "changes"}">Changes<small>${pending().length}</small></button>`;
    for (const b of document.querySelectorAll(".tab")) b.onclick = () => go(b.dataset.k);
  }
  function go(k) { tab = k; sel = null; sortKey = null; limit = 300; renderAll(); try { history.replaceState(null, "", "#" + k); } catch {} }

  // ---- table
  function rowsFor() {
    let rows = ROWS[tab] || [];
    if (q) { const s = q.toLowerCase(); rows = rows.filter(r => Object.values(eff(r)).some(v => String(v).toLowerCase().includes(s)) || (tab !== "items" && Object.values(r.f).some(v => ITEMNAME[v] && ITEMNAME[v].toLowerCase().includes(s)))); }
    if (sortKey) rows = [...rows].sort((a, b) => { const x = cell(a, sortKey), y = cell(b, sortKey); const nx = Number(x), ny = Number(y); const c = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : String(x).localeCompare(String(y)); return c * sortDir; });
    return rows;
  }
  function renderTable() {
    const w = $("#tablewrap");
    if (tab === "changes") { renderChanges(); return; }
    if (tab === "login") { renderStage(); return; }
    const t = tdef(tab), rows = rowsFor();
    const isNum = c => { const v = ROWS[tab][0] && cell(ROWS[tab][0], c); return v !== undefined && v !== "" && !isNaN(Number(v)); };
    const label = c => c === "@ingredients" ? "ingredients" : c === "@materials" ? "materials" : c;
    w.innerHTML = `<table><thead><tr>${t.cols.map(c => `<th data-c="${esc(c)}" class="${isNum(c) ? "num" : ""}" ${sortKey === c ? `aria-sort="${sortDir > 0 ? "ascending" : "descending"}"` : ""}>${esc(label(c))}${sortKey === c ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead><tbody>${
      rows.slice(0, limit).map(r => { const e = pendingEdit(r); return `<tr data-k="${esc(r.kind + "|" + r.id)}" aria-selected="${sel === r.kind + "|" + r.id}">${t.cols.map((c, i) => {
        const chg = e && c in e.fields;
        const v = cell(r, c);
        return `<td class="${isNum(c) ? "num" : ""} ${chg ? "ed" : ""}">${i === 1 || (t.cols[0] === c && !isNum(c)) ? `<span class="nm">${esc(v)}</span>` : esc(v)}${i === 0 && e ? '<span class="tag">changed</span>' : ""}</td>`; }).join("")}</tr>`; }).join("")
    }</tbody></table>${rows.length > limit ? `<div class="more"><button class="btn sm" id="moreb">Show ${Math.min(500, rows.length - limit)} more of ${rows.length - limit}</button></div>` : rows.length ? "" : '<div class="more">Nothing matches.</div>'}`;
    for (const th of w.querySelectorAll("th")) th.onclick = () => { const c = th.dataset.c; if (sortKey === c) sortDir = -sortDir; else { sortKey = c; sortDir = 1; } renderTable(); };
    for (const tr of w.querySelectorAll("tbody tr")) tr.onclick = () => { sel = tr.dataset.k; msg = ""; for (const x of w.querySelectorAll("tbody tr")) x.setAttribute("aria-selected", x === tr); renderEditor(); };
    const mb = $("#moreb"); if (mb) mb.onclick = () => { limit += 500; renderTable(); };
  }

  // ---- login screen: the pieces where the game draws them, to drag about
  const lmRow = id => BYKEY.get("login|" + id);
  const lmNum = (v, d) => { const n = parseInt(v, 10); return isNaN(n) ? d : n; };
  function lmHtml(id, v) {
    const kind = LM_BTN.has(id) ? "lm-btn" : LM_BOX.has(id) ? "lm-box" : ["panel", "new account panel"].includes(id) ? "lm-panel" : "lm-" + id.replace(/[^a-z]/g, "");
    const cls = `lm ${kind}${["connect", "create account"].includes(id) ? " lm-connect" : ""}${v.show === "no" ? " hid" : ""}${pendingEdit(lmRow(id)) ? " moved" : ""}`;
    const at = `class="${cls}" data-m="${esc(id)}" tabindex="0" role="button" aria-label="${esc(LM_LABEL[id] || id)}" aria-selected="${sel === "login|" + id}"`;
    const inside = LM_INSIDE.includes(id);
    const size = v.width !== undefined ? `width:${lmNum(v.width, 98)}px;height:${lmNum(v.height, 24)}px;` : "";
    const box = (inside ? `left:${lmNum(v.x, 0)}px;top:${lmNum(v.y, 0)}px;` : "") + size;
    if (id === "logo") return `<div ${at}><div class="s">${esc(v.text)}</div><div class="b">${esc(v["text 2"])}</div></div>`;
    if (id === "news") { const ls = [1, 2, 3, 4].map(i => v["line " + i]).filter(Boolean);
      return `<div ${at}><div class="h">${esc(v.text)}</div>${ls.map((l, i) => `<div class="${i ? "l" : "l1"}">${esc(l)}</div>`).join("") || '<div class="l">(news.txt)</div>'}</div>`; }
    if (id === "town") return `<div ${at}>A R E S D E N</div>`;
    if (id === "version") return `<div ${at}>Client version</div>`;
    if (id === "characters title") return `<div ${at}>${esc(v.text)}</div>`;
    if (id === "hint") return `<div ${at}>${esc(v["line 1"])}</div>`;
    if (id === "change password") return `<div ${at} style="${box}">${esc(v.text)}</div>`;
    if (id === "character info") return `<div ${at} style="${box}"><div class="t">NAME</div><div class="st">Level, location, class and stats</div></div>`;
    if (id === "account help") return `<div ${at} style="${box}">Help for the box being typed in<br>shows here, up to three lines</div>`;
    if (id === "panel" || id === "new account panel") { const sc = SCREENS.find(x => x.panel === id);
      return `<div ${at} style="${size}"><div class="t">${esc(v.text)}</div><div class="st">${esc(v["text 2"])}</div>${sc.inside.map(c => lmHtml(c, eff(lmRow(c)))).join("")}</div>`; }
    if (id === "remember") return `<div ${at} style="${box}"><i></i>${esc(v.text)}</div>`;
    if (LM_BOX.has(id)) return `<div ${at} style="${box}"><span class="lb">${esc(v.text)}</span></div>`;
    return `<div ${at} style="${box}">${esc(id === "delete" ? v.text + " / " + v["text 2"] : v.text)}</div>`;
  }
  function lmPlace(el, v, W, H) {      // as the game does: the anchor point of the screen, the same point of the piece, then x and y
    const a = Math.max(0, ANCHORS.indexOf(v.anchor)), col = a % 3, row = Math.floor(a / 3), w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = (Math.floor(W * col / 2) - Math.floor(w * col / 2) + lmNum(v.x, 0)) + "px";
    el.style.top = (Math.floor(H * row / 2) - Math.floor(h * row / 2) + lmNum(v.y, 0)) + "px";
  }
  function renderStage() {
    const w = $("#tablewrap"), [W, H] = STAGES[stage];
    if (!ROWS.login.length) { w.innerHTML = '<div class="more">This copy of the dashboard has no sign-in screen layout in it.</div>'; return; }
    const n = pending().filter(e => e.kind === "login").length;
    const sc = SCREENS[screen];
    w.innerHTML = `<div class="stagewrap"><div class="stagebar"><label for="scsel">Screen</label><select id="scsel">${SCREENS.map((x, i) => `<option value="${i}" ${i === screen ? "selected" : ""}>${x.label}</option>`).join("")}</select><label for="stsel">on a</label><select id="stsel">${STAGES.map((s, i) => `<option value="${i}" ${i === stage ? "selected" : ""}>${s[2]} (${s[0]} × ${s[1]})</option>`).join("")}</select>
      <span>Drag the pieces. Blue dot = moved or changed, waiting for the next update.</span>${n && canWrite ? `<button class="btn sm" id="lmreset">Put all ${n} back</button>` : ""}</div>
      <div class="stagefit" id="stfit"><div class="stage" id="stage" style="width:${W}px;height:${H}px">${sc.top.map(id => lmHtml(id, eff(lmRow(id)))).join("")}</div></div></div>`;
    const st = $("#stage"), fit = $("#stfit");
    const k = Math.min(1.6, (fit.clientWidth || W) / W);
    st.style.transform = `scale(${k})`; fit.style.height = Math.round(H * k) + "px";
    for (const id of sc.top) lmPlace(st.querySelector(`[data-m="${id}"]`), eff(lmRow(id)), W, H);
    $("#stsel").onchange = ev => { stage = +ev.target.value; renderStage(); };
    $("#scsel").onchange = ev => { screen = +ev.target.value; renderStage(); };
    const rs = $("#lmreset"); if (rs) rs.onclick = async () => { for (const e of pending().filter(e => e.kind === "login")) await store(lmRow(e.id), {}, true); renderAll(); };
    for (const el of st.querySelectorAll(".lm")) {
      const id = el.dataset.m, r = lmRow(id);
      el.onpointerdown = ev => {
        ev.stopPropagation(); ev.preventDefault();
        if (sel !== r.kind + "|" + id) { sel = r.kind + "|" + id; msg = ""; for (const x of st.querySelectorAll(".lm")) x.setAttribute("aria-selected", x === el); renderEditor(); }
        el.focus({ preventScroll: true });
        if (!canWrite) return;
        const v = eff(r), x0 = lmNum(v.x, 0), y0 = lmNum(v.y, 0), l0 = parseFloat(el.style.left), t0 = parseFloat(el.style.top), sx = ev.clientX, sy = ev.clientY;
        let dx = 0, dy = 0;
        el.setPointerCapture(ev.pointerId); el.classList.add("drag");
        el.onpointermove = mv => { dx = Math.round((mv.clientX - sx) / k); dy = Math.round((mv.clientY - sy) / k); el.style.left = (l0 + dx) + "px"; el.style.top = (t0 + dy) + "px"; };
        el.onpointerup = el.onpointercancel = () => { el.onpointermove = el.onpointerup = el.onpointercancel = null; el.classList.remove("drag");
          if (dx || dy) lmMove(r, x0 + dx, y0 + dy); };
      };
      el.onkeydown = ev => {
        const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
        if (!d || !canWrite) return;
        ev.preventDefault(); ev.stopPropagation();
        const v = eff(r), s = ev.shiftKey ? 10 : 1;
        sel = r.kind + "|" + id; lmMove(r, lmNum(v.x, 0) + d[0] * s, lmNum(v.y, 0) + d[1] * s, id);
      };
    }
  }
  // a piece moved: keep it with whatever else is already changed on it
  async function lmMove(r, x, y, refocus) {
    const e = pendingEdit(r), fields = { ...(e ? e.fields : {}), x: String(x), y: String(y) };
    for (const k of Object.keys(fields)) if (fields[k] === String(r.f[k] ?? "")) delete fields[k];
    await store(r, fields, true);
    if (refocus) { const el = document.querySelector(`.lm[data-m="${CSS.escape(refocus)}"]`); if (el) el.focus({ preventScroll: true }); }
  }

  // ---- editor: every field of the picked row
  function renderEditor() {
    const a = $("#editor");
    if (tab === "changes") { a.innerHTML = '<div class="empty">Changes saved here go onto the server the next time Claude updates it: ask for "apply the dashboard changes".</div>'; return; }
    const r = sel && BYKEY.get(sel);
    if (!r) { a.innerHTML = `<div class="empty">${tab === "login" ? "Pick a piece of the sign-in screen to change its words, size, anchor or whether it shows." : "Pick a row to see and change every value it has."}</div>${NOTES[tab] ? `<div class="note">${esc(NOTES[tab])}</div>` : ""}`; return; }
    const e = pendingEdit(r), v = eff(r), lock = new Set(LOCKED[r.kind] || []);
    const fields = r.kind === "login" ? Object.keys(r.f) : fieldsOf(r.kind);
    a.innerHTML = `<div class="edh"><h2>${esc(titleOf(r))}</h2><div class="mini">${esc(tdef(r.kind).label)} · ${esc(r.id)}${e ? ' <span class="tag">saved change waiting</span>' : ""}</div></div>
      <form id="edform"><div class="fgrid">${fields.map(k => {
        const val = v[k] ?? "", ro = !canWrite || lock.has(k) || k === "share of tier";
        const hint = (HINTS[k] && HINTS[k][val] !== undefined) ? HINTS[k][val] : (/^(ingredient|material) \d$/.test(k) && ITEMNAME[val]) ? ITEMNAME[val] : "";
        const opts = optsFor(r.kind, k);
        if (LONG.has(k)) return `<label for="f_${esc(k)}" title="${esc(k)}">${esc(k)}</label><textarea class="fin ${e && k in e.fields ? "chg" : ""}" id="f_${esc(k)}" data-f="${esc(k)}" rows="4" ${ro ? "readonly" : ""}>${esc(val)}</textarea>`
          + (e && k in e.fields ? `<div class="was">in game now: ${esc(r.f[k])}</div>` : "");
        if (opts) return `<label for="f_${esc(k)}" title="${esc(k)}">${esc(k)}</label><select class="fin ${e && k in e.fields ? "chg" : ""}" id="f_${esc(k)}" data-f="${esc(k)}" ${ro ? "disabled" : ""}>${opts.map(o => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}</select>`
          + (e && k in e.fields ? `<div class="was">in game now: ${esc(r.f[k])}</div>` : "");
        return `<label for="f_${esc(k)}" title="${esc(k)}">${esc(k)}</label><input class="fin ${e && k in e.fields ? "chg" : ""}" id="f_${esc(k)}" data-f="${esc(k)}" value="${esc(val)}" ${ro ? "readonly" : ""} autocomplete="off">`
          + (e && k in e.fields ? `<div class="was">in game now: ${esc(r.f[k])}</div>` : "") + (hint ? `<div class="hint">${esc(hint)}</div>` : "");
      }).join("")}</div>
      <div class="acts"><button class="btn pri" type="submit" ${canWrite ? "" : "disabled"}>Save change</button>${e ? '<button class="btn" type="button" id="revert">Back to the in-game values</button>' : ""}</div></form>
      ${msg ? `<div class="msg ${msgKind}">${esc(msg)}</div>` : ""}
      ${canWrite ? "" : `<div class="note">${db ? "You can look but not change values in this view." : "Changes can't be saved in this view: open the dashboard on claude.ai while signed in."}</div>`}
      ${NOTES[r.kind] ? `<div class="note">${esc(NOTES[r.kind])}</div>` : ""}`;
    $("#edform").onsubmit = ev => { ev.preventDefault(); save(r); };
    for (const inp of a.querySelectorAll(".fin")) inp.oninput = () => inp.classList.toggle("chg", inp.value.trim() !== String(r.f[inp.dataset.f] ?? ""));
    const rv = $("#revert"); if (rv) rv.onclick = () => store(r, {});
  }
  function save(r) {
    const fields = {}, lock = new Set(LOCKED[r.kind] || []);
    for (const inp of document.querySelectorAll("#edform .fin")) {
      const k = inp.dataset.f, nv = inp.value.trim();
      if (lock.has(k) || k === "share of tier") continue;
      if (CONTENT.has(r.kind)) {     // words may have spaces; the full check is made when the change is put into the game
        const num = /^(count|min level|reward count|x|y|gold|gear chance|chest tier)$/.test(k) || / (count|chance)$/.test(k);
        if (num && nv !== "" && !/^\d+$/.test(nv)) { msg = `"${k}" must be a whole number.`; msgKind = "err"; renderEditor(); return; }
        if (nv.length > (LONG.has(k) ? 600 : 80)) { msg = `"${k}" is too long.`; msgKind = "err"; renderEditor(); return; }
        if (nv === "" && !/^objective \d (target|label)$/.test(k) && k !== "chest tier") { msg = `"${k}" can't be empty.`; msgKind = "err"; renderEditor(); return; }
        if (nv !== String(r.f[k] ?? "")) fields[k] = nv;
        continue;
      }
      if (r.kind === "login") {      // words may have spaces or be left empty; places and sizes are whole numbers
        const isSize = k === "width" || k === "height";
        if ((k === "x" || k === "y" || isSize) && !/^-?\d+$/.test(nv)) { msg = `"${k}" must be a whole number.`; msgKind = "err"; renderEditor(); return; }
        if (isSize && +nv < 1) { msg = `"${k}" must be 1 or more.`; msgKind = "err"; renderEditor(); return; }
        if (nv.length > 120) { msg = `"${k}" can be 120 characters at most.`; msgKind = "err"; renderEditor(); return; }
        if (nv !== String(r.f[k] ?? "")) fields[k] = nv;
        continue;
      }
      if (nv === "" || /\s/.test(nv)) { msg = `"${k}" can't be empty or have spaces in it.`; msgKind = "err"; renderEditor(); return; }
      if (r.kind === "drops" && !/^\d+$/.test(nv)) { msg = `"${k}" must be a whole number.`; msgKind = "err"; renderEditor(); return; }
      if (nv !== String(r.f[k] ?? "")) fields[k] = nv;
    }
    store(r, fields);
  }
  async function store(r, fields, quiet) {
    if (!db || !canWrite) return;
    const id = docId(r.kind, r.id);
    try {
      if (!Object.keys(fields).length) { await db.doc("edits/" + id).delete(); delete edits[id]; msg = "Back to the in-game values."; }
      else {
        const base = {}; for (const k of Object.keys(fields)) base[k] = r.f[k];
        const doc = { kind: r.kind, id: r.id, name: String(titleOf(r)), fields, base, status: "pending", updatedAt: new Date().toISOString() };
        await db.doc("edits/" + id).set(doc); edits[id] = doc;
        msg = r.kind === "login" ? "Saved. It goes into the game with the next update." : CONTENT.has(r.kind) ? "Saved. It goes into the game with the next update and rebuild." : "Saved. It goes onto the server with the next update.";
      }
      msgKind = "ok";
    } catch (err) { msg = "Couldn't save: " + (err && err.message || "the store didn't answer"); msgKind = "err"; }
    renderChips(); renderTabs(); renderTable(); renderEditor();
  }

  // ---- changes
  function renderChanges() {
    const w = $("#tablewrap");
    const all = Object.values(edits).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
    const p = all.filter(e => e.status === "pending"), done = all.filter(e => e.status === "applied").slice(0, 40), bad = all.filter(e => e.status === "failed");
    const card = e => { const r = BYKEY.get(e.kind + "|" + e.id);
      return `<div class="change"><h3>${esc(e.name || e.id)} <span class="mini">${esc((tdef(e.kind) || { label: e.kind }).label)}</span>${e.status === "applied" ? '<span class="tag ok">on the server</span>' : e.status === "failed" ? '<span class="tag" style="border-color:var(--bad);color:var(--bad)">couldn\'t apply</span>' : ""}
        ${e.status === "pending" && canWrite && r ? `<button class="btn sm" data-undo="${esc(e.kind + "|" + e.id)}">Undo</button>` : ""}${e.status === "pending" && r ? `<button class="btn sm" data-open="${esc(e.kind + "|" + e.id)}">Open</button>` : ""}</h3>
        <div class="row">${Object.entries(e.fields).map(([k, v]) => `<span class="mini">${esc(k)}</span><span><span class="from">${esc((e.base || {})[k] ?? "")}</span><span class="to">${esc(v)}</span></span>`).join("")}</div>${e.note ? `<div class="mini" style="margin-top:6px">${esc(e.note)}</div>` : ""}</div>`; };
    w.innerHTML = `<div class="changes">
      <h4>Waiting for the next update (${p.length})</h4>${p.length ? p.map(card).join("") : '<div class="mini">Nothing waiting. Pick a tab, change a value and save it.</div>'}
      ${bad.length ? `<h4>Couldn't be applied (${bad.length})</h4>${bad.map(card).join("")}` : ""}
      ${done.length ? `<h4>Recently put on the server</h4>${done.map(card).join("")}` : ""}</div>`;
    for (const b of w.querySelectorAll("[data-undo]")) b.onclick = () => store(BYKEY.get(b.dataset.undo), {});
    for (const b of w.querySelectorAll("[data-open]")) b.onclick = () => { const [k] = b.dataset.open.split("|"); tab = k; sel = b.dataset.open; renderAll(); };
  }

  function renderAll() { renderChips(); renderTabs(); renderTable(); renderEditor(); }
  window.addEventListener("resize", () => { if (tab === "login") renderStage(); });
  $("#q").oninput = ev => { q = ev.target.value.trim(); limit = 300; renderTable(); };

  // ---- shared store (window.claude): saved edits, kept for Claude to put on the server
  async function connect() {
    const timer = setTimeout(() => { loaded = true; renderChips(); }, 10000);
    try { db = await window.claude?.use?.("db"); } catch { db = null; }
    canWrite = !!db;
    try { const user = await window.claude?.use?.("user"); if (user && user.can) { const ok = await user.can("data.write"); if (ok === false) canWrite = false; } } catch {}
    loaded = true;
    if (!db) { clearTimeout(timer); renderAll(); return; }
    try {
      db.collection("edits").onSnapshot(snap => {
        clearTimeout(timer);
        const next = {}; for (const d of snap.docs) if (d.exists) next[d.id] = d.data();
        edits = next; renderChips(); renderTabs(); if (tab === "changes") renderTable(); else { renderTable(); renderEditor(); }
      }, () => { clearTimeout(timer); renderChips(); });
    } catch { clearTimeout(timer); }
    renderAll();
  }

  const h = (location.hash || "").slice(1);
  if (h && (tdef(h) || h === "changes")) tab = h;
  renderAll();
  connect();
})();
</script>
</body>
</html>
